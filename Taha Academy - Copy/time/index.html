    <script>
function filterList(continent) {
    const items = document.querySelectorAll('.item');
    items.forEach(item => {
        if (continent === 'all' || item.classList.contains(continent)) {
            item.style.display = 'block';
        } else {
            item.style.display = 'none';
        }
    });
}
</script>
