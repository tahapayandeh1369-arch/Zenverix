    <body>
    <div class="container">
        <a href="index.html" class="btn-back">بازگشت به خانه</a>
        <h1>کشورهای اروپا</h1>

        <ul class="list" id="europe-list">
            <li><a href="clock.html?country=Europe/London">انگلیس (لندن)</a></li>

        </ul>

        <h3>افزودن کشور جدید به اروپا</h3>
        <form id="add-country-form">
            <input type="text" id="country-name" placeholder="نام کشور" required>
            <input type="text" id="timezone" placeholder="Timezone (مثلا Europe/Vienna)" required>
            <button type="submit">افزودن به لیست</button>
        </form>
